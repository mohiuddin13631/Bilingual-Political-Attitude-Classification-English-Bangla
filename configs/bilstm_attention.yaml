# BiLSTM + additive attention classifier (PyTorch).
# Inherits configs/base.yaml.

experiment_name: bilstm_attention
model:
  type: bilstm_attention
  vocab:
    max_size: 30000
    min_freq: 2
    max_len: 64
  embedding_dim: 128
  hidden_dim: 128
  num_layers: 1
  bidirectional: true
  attention_dim: 96
  dropout: 0.4

train:
  epochs: 8
  batch_size: 64
  lr: 0.002
  weight_decay: 1.0e-5
  grad_clip: 5.0
  early_stopping_patience: 3
  device: auto            # auto | cpu | cuda
