# TF-IDF + Linear SVM baseline (calibrated for probabilities).
# Inherits configs/base.yaml.

experiment_name: baseline_svm
model:
  type: tfidf_linear
  classifier: linear_svm
  tfidf:
    ngram_range: [1, 2]
    max_features: 50000
    min_df: 2
    sublinear_tf: true
  linear_svm:
    C: 1.0
    class_weight: balanced

train:
  calibrate_probabilities: true
